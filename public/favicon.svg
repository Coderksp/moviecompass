<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2E93"/>
      <stop offset="0.5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0A0612"/>
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="url(#g)" stroke-width="1.6" opacity="0.45"/>
  <!-- Compass needle tilted to read as a play triangle: the lit half points the
       way, the dim half is the tail. -->
  <g transform="rotate(38 16 16)">
    <polygon points="16,5.5 20.2,16 11.8,16" fill="url(#g)"/>
    <polygon points="16,26.5 20.2,16 11.8,16" fill="#A855F7" opacity="0.32"/>
  </g>
  <circle cx="16" cy="16" r="1.5" fill="#0A0612"/>
</svg>
